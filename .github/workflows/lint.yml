name: Lint

# 문서·스크립트 저장소라 검사도 가볍다: markdownlint, shellcheck, 문서 상한(check-docs.sh), 설치 병합 시험(세 운영체제).
# 전부 러너에 일회성으로 설치하고 저장소에는 의존성을 두지 않는다.
# push는 main만, 브랜치 작업은 PR 이벤트로만 — 같은 커밋이 두 번 돌지 않게.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # 문서 검사가 5분을 넘기면 뭔가 잘못된 것. 분 소진 방지
    steps:
      - uses: actions/checkout@v7

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !node_modules
            !dist

      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          # 초안 폴더가 비면 글롭이 문자 그대로 넘어가 실패했다(2026-09-29, Issue #161). 빈 글롭은 건너뛴다
          shopt -s nullglob
          shellcheck -S warning base/hooks/*.sh base/vscode/install.sh base/skills/*/scripts/*.sh tools/*.sh .claude/hooks/*.sh drafts/hooks/*.sh

      - name: 문서 상한·필수 파일
        run: bash tools/check-docs.sh

  # 같은 저장소를 Windows·Mac에서 쓰므로 세 운영체제에서 같은 시험을 돌린다(Issue #197).
  # 임시 CLAUDE_CONFIG_DIR만 써서 러너의 홈은 건드리지 않는다(Issue #194).
  # 공개 저장소라 표준 러너 분이 무료다. 비공개로 바꾸면 Windows 2배·macOS 10배라 다시 검토한다.
  install-test:
    name: 설치 병합 시험 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false   # 한 운영체제가 실패해도 나머지 결과를 끝까지 본다
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash      # Windows는 Git Bash
    steps:
      - uses: actions/checkout@v7

      - name: 설치 병합 시험
        run: bash tools/test-install-merge.sh

      - name: PROGRESS 낡음 알림 훅 시험
        run: bash tools/test-progress-stale-check.sh
