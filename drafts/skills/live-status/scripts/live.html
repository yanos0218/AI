<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세션 현황</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2430; --muted:#5b6575; --line:#d9dee6;
          --busy:#0a7a3d; --busy-bg:#e3f5ea; --idle:#4b5565; --idle-bg:#eceff3;
          --unknown:#8a5a00; --unknown-bg:#fff2d6; --ended:#6b7280; --ended-bg:#f1f2f4; --warn:#a31515; --warn-bg:#fde8e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181f; --card:#1d232d; --text:#e8ecf2; --muted:#a3adbd; --line:#2f3846;
            --busy:#58d68d; --busy-bg:#173626; --idle:#b7c0cf; --idle-bg:#272f3b;
            --unknown:#f5c26b; --unknown-bg:#3b2f14; --ended:#8d97a8; --ended-bg:#222833; --warn:#ff8f8f; --warn-bg:#3d1b1b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; }
  h1 { font-size:1.1rem; margin:0 0 4px; }
  #summary { font-size:1.6rem; font-weight:700; margin:4px 0 12px; }
  #banner { display:none; padding:10px 14px; border-radius:8px; margin-bottom:12px; font-weight:600; background:var(--warn-bg); color:var(--warn); }
  #meta { color:var(--muted); font-size:.85rem; margin-bottom:12px; }
  #list { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card.busy { border-color:var(--busy); } .card.unknown { border-color:var(--unknown); }
  .card.ended { opacity:.7; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .name { font-size:1.35rem; font-weight:700; overflow-wrap:anywhere; }
  .folder { color:var(--muted); font-size:.9rem; overflow-wrap:anywhere; }
  .chip { white-space:nowrap; padding:4px 10px; border-radius:999px; font-weight:700; font-size:.95rem; }
  .busy .chip { color:var(--busy); background:var(--busy-bg); } .idle .chip { color:var(--idle); background:var(--idle-bg); }
  .unknown .chip { color:var(--unknown); background:var(--unknown-bg); } .ended .chip { color:var(--ended); background:var(--ended-bg); }
  .big { font-size:1.25rem; font-weight:600; margin-top:10px; } .small { color:var(--muted); font-size:.9rem; margin-top:2px; }
  .pulse { display:inline-block; animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation:none; } }
  #empty { color:var(--muted); padding:24px 0; }
</style>
</head>
<body>
<h1>Claude Code 세션 현황</h1>
<div id="summary" aria-live="polite">불러오는 중…</div>
<div id="banner" role="alert"></div>
<div id="meta"></div>
<div id="list"></div>
<div id="empty" hidden>지금 돌고 있는 세션이 없습니다.</div>
<script>
(function () {
  var data = null, fetchedPerf = 0, failedSince = null;
  var ICON = { busy: '▶', idle: '⏸', ended: '■', unknown: '?' };
  var LABEL = { busy: '작업 중', idle: '쉬는 중', ended: '끝남', unknown: '확인 불가' };

  function fmt(ms) {
    if (ms == null || ms < 0) return '-';
    var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    if (h > 0) return h + '시간 ' + m + '분';
    if (m > 0) return m + '분 ' + (s % 60) + '초';
    return s + '초';
  }
  function serverNow() { return data.server_ms + (performance.now() - fetchedPerf); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function render() {
    var list = document.getElementById('list'), banner = document.getElementById('banner');
    if (!data) return;
    var now = serverNow(), msgs = [];
    if (failedSince !== null) msgs.push('서버에 연결되지 않음 · 마지막 정상 갱신 ' + fmt(performance.now() - fetchedPerf) + ' 전');
    else if (!data.ok) msgs.push('세션 목록을 읽지 못함 · ' + data.error);
    else if (data.last_ok_ms && now - data.last_ok_ms > 10000) msgs.push('데이터 갱신이 ' + fmt(now - data.last_ok_ms) + ' 전부터 멈춤');
    banner.style.display = msgs.length ? 'block' : 'none';
    banner.textContent = msgs.join(' / ');

    var counts = { busy: 0, idle: 0, ended: 0, unknown: 0 };
    list.textContent = '';
    data.sessions.forEach(function (s) {
      counts[s.state]++;
      var card = el('div', 'card ' + s.state), top = el('div', 'top'), left = el('div');
      left.appendChild(el('div', 'name', s.name || '(이름 없음)'));
      left.appendChild(el('div', 'folder', s.folder));
      var chip = el('div', 'chip');
      chip.appendChild(el('span', s.state === 'busy' ? 'pulse' : '', ICON[s.state] + ' '));
      chip.appendChild(document.createTextNode(LABEL[s.state]));
      top.appendChild(left); top.appendChild(chip); card.appendChild(top);
      if (s.state === 'busy') {
        if (s.busy_since_ms && s.busy_exact) card.appendChild(el('div', 'big', '이번 요청 ' + fmt(now - s.busy_since_ms) + '째'));
        else card.appendChild(el('div', 'big', '작업 중 · 이 화면을 켠 뒤 ' + fmt(now - s.first_seen_ms) + '째'));
      } else if (s.state === 'ended') {
        card.appendChild(el('div', 'big', '끝남 · ' + fmt(now - s.ended_ms) + ' 전'));
      } else if (s.state === 'unknown') {
        card.appendChild(el('div', 'big', '알 수 없는 상태: ' + (s.raw_status || '-')));
      } else {
        card.appendChild(el('div', 'big', '쉬는 중'));
      }
      if (s.started_ms) card.appendChild(el('div', 'small', '세션 시작 후 ' + fmt(now - s.started_ms)));
      list.appendChild(card);
    });
    var parts = ['작업 중 ' + counts.busy, '쉬는 중 ' + counts.idle];
    if (counts.unknown) parts.push('확인 불가 ' + counts.unknown);
    if (counts.ended) parts.push('끝남 ' + counts.ended);
    document.getElementById('summary').textContent = parts.join(' · ');
    document.title = (counts.busy ? '▶ ' + counts.busy + ' 작업 중' : '세션 현황') + (banner.style.display === 'block' ? ' ⚠' : '');
    document.getElementById('empty').hidden = data.sessions.length > 0;
    document.getElementById('meta').textContent = '화면은 서버 시각 기준으로 1초마다 갱신, 서버는 ' + data.poll_sec + '초마다 세션 목록을 읽음 · 서브에이전트는 표시하지 않음';
  }

  function poll() {
    fetch('/api/state', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (j) { data = j; fetchedPerf = performance.now(); failedSince = null; render(); })
      .catch(function () { if (failedSince === null) failedSince = performance.now(); render(); });
  }
  poll();
  setInterval(poll, 2000);
  setInterval(render, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
})();
</script>
</body>
</html>
