<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>토큰 사용 기록</title><style>
:root{--bg:#f6f6f4;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--ink3:#8a8984;--line:#e4e3df;--hover:#eeede9;--accent:#2a78d6;--warn:#eda100;
--c0:#2a78d6;--c1:#eb6834;--c2:#1baf7a;--c3:#eda100;--c4:#e87ba4;--c5:#a3a29d;--tag:#efeee9}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--card:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--ink3:#8f8e87;--line:#34332f;--hover:#262624;--accent:#3987e5;--warn:#c98500;
--c0:#3987e5;--c1:#d95926;--c2:#199e70;--c3:#c98500;--c4:#d55181;--c5:#6d6c67;--tag:#2a2a28}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:18px;margin:0}.sub{color:var(--ink2);font-size:12px}.muted{color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.glance{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr);gap:12px;margin-bottom:12px}@media (max-width:820px){.glance{grid-template-columns:1fr}}
.glance ul{margin:0;padding-left:18px}.glance li{margin:3px 0}.glance li b{font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 10px}.kpi .l{color:var(--ink2);font-size:12px}
.kpi .v{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}.kpi .s{color:var(--ink3);font-size:11px;line-height:1.35}.kpi.warn{border-color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;vertical-align:middle}
.seg button{font:inherit;font-size:13px;border:0;background:none;color:var(--ink2);padding:4px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lab{color:var(--ink3);font-size:12px;margin:0 4px 0 10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 12px}
.tabs button{font:inherit;border:0;background:none;color:var(--ink2);padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:6px 0;align-items:center;margin-bottom:8px}
.split{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(220px,1fr);gap:16px}@media (max-width:820px){.split{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto;overflow:visible}.grid{stroke:var(--line)}.axis{fill:var(--ink3);font-size:11px}
.col:hover .hl,.col:focus .hl{fill:var(--hover)}.col:focus{outline:none}
.medline{stroke:var(--ink3);stroke-dasharray:4 4}.sline{fill:none;stroke:var(--c0);stroke-width:2}
#tip{position:fixed;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
box-shadow:0 4px 16px rgba(0,0,0,.12);font-size:12px;min-width:170px;max-width:300px;display:none;z-index:9}
#tip .t{color:var(--ink2);margin-bottom:4px}#tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
#tip .r b{font-variant-numeric:tabular-nums}#tip .k{display:inline-block;width:12px;height:2px;margin-right:6px;vertical-align:3px}
#tip .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
table{border-collapse:collapse;width:100%;font-size:13px}th{color:var(--ink2);font-weight:500;text-align:left}
td,th{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:top}.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rank td{padding:4px 4px}.rank i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.scroll{max-height:340px;overflow:auto}
details{border-top:1px solid var(--line)}details:first-of-type{border-top:0}

summary::before{content:'›';color:var(--ink3);transition:transform .15s;display:inline-block;width:10px}details[open]>summary::before{transform:rotate(90deg)}
summary .name{flex:1}summary .val{font-variant-numeric:tabular-nums;font-weight:600}summary .pct{color:var(--ink3);width:48px;text-align:right;font-size:12px}
summary .meter{width:90px;height:6px;border-radius:3px;background:var(--hover);overflow:hidden}summary .meter span{display:block;height:100%;background:var(--c1)}
.acc-body{padding:0 4px 12px 24px;font-size:13px;color:var(--ink2)}.acc-body ul{margin:4px 0 8px;padding-left:18px}.acc-body b{color:var(--ink)}
.more{font-size:12px;color:var(--ink2)}
.tag{display:inline-block;background:var(--tag);color:var(--ink2);border-radius:10px;padding:0 7px;font-size:11px;margin:1px 3px 1px 0;white-space:nowrap}
.req{cursor:pointer}.req:hover td{background:var(--hover)}.req td.q{max-width:440px}.det td{background:var(--hover);font-size:12px;color:var(--ink2)}.det b{color:var(--ink)}
.det ul{margin:2px 0;padding-left:18px}
.empty{color:var(--ink3);padding:20px 0;text-align:center}
.off{background:#fff4d6;color:#5a4300;border-radius:8px;padding:6px 12px;margin-bottom:10px;font-size:13px}
@media (prefers-color-scheme:dark){.off{background:#3a2f10;color:#f3dfa3}}
footer{color:var(--ink3);font-size:12px;margin-top:6px}footer ul{margin:0;padding-left:18px}
[hidden]{display:none!important}
</style></head><body><main>
<div class="top"><div><h1>토큰 사용 기록</h1><div class="sub" id="meta"></div></div>
<div><span class="lab">기준</span><span class="seg" data-k="metric"><button data-v="nocache">캐시 제외</button><button data-v="all">전체</button></span>
<label class="sub" style="margin-left:10px"><input type="checkbox" id="auto"> 자동 새로고침</label></div></div>
<div id="offnote"></div>
<section class="glance"><div class="card" style="margin:0"><div class="sub" style="margin-bottom:4px">한눈에</div><ul id="insights"></ul></div>
<div class="card" style="margin:0"><div class="kpis" id="kpis"></div></div></section>
<section class="card">
<div class="tabs" role="tablist"><button role="tab" data-t="usage">사용량</button><button role="tab" data-t="reqs">많이 쓴 요청</button><button role="tab" data-t="causes">원인</button></div>
<div data-p="usage">
 <div class="bar"><span class="lab" style="margin-left:0">기간</span><span class="seg" data-k="view"><button data-v="block">5시간 블록</button><button data-v="hour">48시간</button><button data-v="day">60일</button><button data-v="month">월별</button></span>
 <span class="lab">나눠 보기</span><span class="seg" data-k="split"><button data-v="proj">저장소</button><button data-v="who">누가</button><button data-v="model">모델</button></span></div>
 <div class="split"><div><div id="chart"></div><div class="more" id="viewnote"></div></div><div><div class="sub" id="ranktitle" style="margin-bottom:4px"></div><table class="rank" id="rank"></table></div></div>
 <details style="margin-top:8px"><summary><span class="name more">기간별 숫자 표</span></summary><div class="scroll" id="tbl"></div></details>
</div>
<div data-p="reqs" hidden>
 <div class="bar"><span class="lab" style="margin-left:0">범위</span><span class="seg" data-k="range"><button data-v="7">최근 7일</button><button data-v="30">최근 30일</button></span>
 <span class="more" style="margin-left:10px">줄을 누르면 무엇에 썼는지 펼쳐짐</span></div>
 <div class="scroll" id="reqs" style="max-height:520px"></div>
</div>
<div data-p="causes" hidden>
 <div class="more" id="causenote" style="margin-bottom:4px"></div><div id="causes"></div>
</div>
</section>
<footer><ul><li>이 기기에서 쓴 것만 집계함(다른 기기·claude.ai 웹 제외)</li><li>계정 한도 대비 사용률은 /usage(VS Code는 계정·사용량 창)에서 확인</li><li>로컬 파일이라 보는 데 토큰이 들지 않음</li></ul></footer>
</main><div id="tip" role="status" aria-live="polite"></div>
<script>
const D=__DATA__;
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s), NS='http://www.w3.org/2000/svg';
const FAM=['opus','sonnet','haiku','fable','other'], FAMN={opus:'Opus',sonnet:'Sonnet',haiku:'Haiku',fable:'Fable',other:'기타'};
const pad=n=>String(n).padStart(2,'0');
const kHour=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}`;
const hourDate=k=>new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10),+k.slice(11,13));
function ko(n){n=Math.round(n);if(n>=1e8)return(n/1e8).toFixed(n>=1e9?0:1)+'억';if(n>=1e4)return(n/1e4).toFixed(n>=1e5?0:1)+'만';return n.toLocaleString()}
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function h(t,cls,txt){const e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function li(parent,...parts){const l=h('li');parts.forEach(p=>l.append(typeof p==='string'?document.createTextNode(p):p));parent.appendChild(l);return l}
const B=t=>h('b',null,t);
let S={tab:'usage',view:'day',metric:'nocache',split:'proj',range:'7',open:''};
try{const q=Object.fromEntries((location.hash.slice(1)||'').split('&').filter(x=>x.includes('=')).map(x=>x.split('=')));Object.assign(S,q)}catch(e){}
const val=b=>S.metric==='all'?b.in+b.cache+b.out:b.in+b.out;
const reqVal=r=>S.metric==='all'?r.all:r.nocache;
function* cells(from,to){for(const hk in D.hourly){if(from&&hk<from)continue;if(to&&hk>=to)continue;const P=D.hourly[hk];
  for(const proj in P)for(const kind in P[proj])for(const f in P[proj][kind])yield [hk,proj,kind,f,P[proj][kind][f]]}}
const sum=(from,to)=>{let s=0;for(const c of cells(from,to))s+=val(c[4]);return s};
const projName=p=>p==='?'?'(알 수 없음)':p;
function groupOf(proj,kind,f){return S.split==='proj'?proj:S.split==='who'?(kind==='main'?'main':'sub'):f}
let TOPP=[];
function seriesKeys(){if(S.split==='who')return[['main','메인 대화'],['sub','서브에이전트']];
  if(S.split==='model'){const u=new Set();for(const c of cells())u.add(c[3]);return FAM.filter(f=>u.has(f)).map(f=>[f,FAMN[f]])}
  const t={};for(const [,p,,,b] of cells())t[p]=(t[p]||0)+val(b);
  TOPP=Object.entries(t).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
  const ks=TOPP.map(p=>[p,projName(p)]);if(Object.keys(t).length>5)ks.push(['__etc','기타']);return ks}
const normKey=g=>S.split==='proj'&&!TOPP.includes(g)?'__etc':g;
function colorOf(key){if(S.split==='who')return key==='main'?'var(--c0)':'var(--c1)';
  if(S.split==='model')return `var(--c${FAM.indexOf(key)})`;const i=TOPP.indexOf(key);return i<0?'var(--c5)':`var(--c${i})`}
function blocks(){const act=[...new Set([...cells()].filter(c=>val(c[4])>0).map(c=>c[0]))].sort(),out=[];
  for(const hk of act){const d=hourDate(hk),last=out[out.length-1];if(!last||d>=last.end)out.push({start:d,end:new Date(+d+5*36e5),k:hk})}return out}
function periodKeys(){const now=new Date(),out=[];
  if(S.view==='hour'){for(let i=47;i>=0;i--)out.push(kHour(new Date(now-i*36e5)))}
  else if(S.view==='day'){for(let i=59;i>=0;i--)out.push(kHour(new Date(now-i*864e5)).slice(0,10))}
  else if(S.view==='month'){const ks=Object.keys(D.hourly).sort();const st=ks.length?hourDate(ks[0]):now;
    for(let d=new Date(st.getFullYear(),st.getMonth(),1);d<=now;d=new Date(d.getFullYear(),d.getMonth()+1,1))out.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`)}
  else blocks().slice(-14).forEach(b=>out.push('B'+b.k));return out}
function bucketKey(hk,bl){if(S.view==='hour')return hk;if(S.view==='day')return hk.slice(0,10);if(S.view==='month')return hk.slice(0,7);
  const d=hourDate(hk);for(let i=bl.length-1;i>=0;i--)if(d>=bl[i].start&&d<bl[i].end)return 'B'+bl[i].k;return null}
function rows(){const keys=periodKeys(),m=Object.fromEntries(keys.map(k=>[k,{}])),bl=S.view==='block'?blocks():null;
  for(const [hk,p,k,f,b] of cells()){const bk=bucketKey(hk,bl);if(!bk||!m[bk])continue;const s=normKey(groupOf(p,k,f));m[bk][s]=(m[bk][s]||0)+val(b)}
  return keys.map(k=>({k,v:m[k]}))}
function label(k,short){if(k[0]==='B'){const d=hourDate(k.slice(1)),e=new Date(+d+5*36e5);return short?`${d.getMonth()+1}/${d.getDate()} ${d.getHours()}시`:`${d.getMonth()+1}/${d.getDate()} ${d.getHours()}시~${e.getHours()}시`}
  if(k.length===13){const d=k.slice(5,10).replace('-','/');return short?`${+k.slice(11)}시`:`${d} ${+k.slice(11)}시`}
  if(k.length===10)return `${+k.slice(5,7)}/${+k.slice(8)}`;return `${k.slice(0,4)}년 ${+k.slice(5)}월`}
const tip=$('#tip');
function showTip(ev,title,items){tip.replaceChildren();tip.appendChild(h('div','t',title));let tot=0;
  items.forEach(([name,v,c])=>{tot+=v;const r=h('div','r'),l=h('span'),k=h('i','k');k.style.background=c;l.append(k,document.createTextNode(name));r.append(l,h('b',null,ko(v)));tip.appendChild(r)});
  if(items.length>1){const r=h('div','r tot');r.append(h('span',null,'합계'),h('b',null,ko(tot)));tip.appendChild(r)}
  tip.style.display='block';const rc=ev.currentTarget&&ev.currentTarget.getBoundingClientRect?ev.currentTarget.getBoundingClientRect():null;
  const x=ev.clientX||(rc?rc.left+rc.width/2:0),y=ev.clientY||(rc?rc.top:0),w=tip.offsetWidth,H=tip.offsetHeight;
  tip.style.left=Math.max(8,Math.min(innerWidth-w-8,x+14))+'px';tip.style.top=Math.max(8,y-H-10)+'px'}
const hideTip=()=>{tip.style.display='none'};
function hover(g,title,items){g.addEventListener('pointermove',e=>showTip(e,title,items));g.addEventListener('pointerleave',hideTip);g.addEventListener('focus',e=>showTip(e,title,items));g.addEventListener('blur',hideTip)}
function axes(s,W,H,L,T,Bt,max){for(let i=0;i<=4;i++){const y=T+(H-T-Bt)*i/4;el('line',{x1:L,x2:W,y1:y,y2:y,class:'grid'},s);const t=el('text',{x:L-8,y:y+4,class:'axis','text-anchor':'end'},s);t.textContent=ko(max*(1-i/4))}}
function med(a){const v=a.slice().sort((x,y)=>x-y);return v.length?(v.length%2?v[v.length>>1]:(v[v.length/2-1]+v[v.length/2])/2):0}
function day0(n){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-n);return kHour(d)}

/* 한눈에 + 숫자 카드 */
function glance(){const now=new Date(),wk=sum(day0(6)),prev=sum(day0(13),day0(6)),ch=prev?Math.round((wk/prev-1)*100):null;
  const ul=$('#insights');ul.replaceChildren();
  li(ul,'최근 7일 ',B(ko(wk)),' 사용'+(ch==null?'':`, 그 전 7일보다 ${ch>=0?'+':''}${ch}%`));
  const c=causeList().filter(x=>x.tokens!=null).sort((a,b)=>b.tokens-a.tokens)[0];
  if(c&&D.signals.total)li(ul,'가장 큰 원인 ',B(c.name),` (${Math.round(100*c.tokens/D.signals.total)}%)`);
  const r=D.requests.filter(x=>new Date(x.ts)>=new Date(now-7*864e5)).sort((a,b)=>reqVal(b)-reqVal(a))[0];
  if(r)li(ul,'가장 많이 쓴 요청 ',B(`${projName(r.proj)} "${r.text.slice(0,24)}${r.text.length>24?'…':''}"`),` ${ko(reqVal(r))}`);
  const st=D.starts,md=med(st.map(s=>s.ctx)),last=st.length?st[st.length-1].ctx:0;
  if(md&&last>md*1.2)li(ul,'세션 시작 크기가 평소보다 ',B(`${Math.round((last/md-1)*100)}%`),' 큼 → /context로 확인');
  const k=$('#kpis');k.replaceChildren();const bl=blocks(),cur=bl.length&&now<bl[bl.length-1].end?bl[bl.length-1]:null;
  const card=(l,v,s,w)=>{const d=h('div','kpi'+(w?' warn':''));d.append(h('div','l',l),h('div','v',v),h('div','s',s));k.appendChild(d)};
  if(cur){const used=sum(kHour(cur.start)),hrs=Math.max(.5,(now-cur.start)/36e5),proj=used/hrs*5,
    past=med(bl.slice(-15,-1).map(b=>sum(kHour(b.start),kHour(b.end))));
    card(`5시간 블록 ${cur.start.getHours()}~${cur.end.getHours()}시`,ko(used),`이 속도면 ${ko(proj)}`+(past?` · 평소 ${ko(past)}`:''),past&&proj>past*1.5)}
  else card('5시간 블록','-','사용 중인 블록 없음');
  card('오늘',ko(sum(day0(0))),S.metric==='all'?'캐시 포함':'캐시 제외');
  card('이번 달',ko(sum(kHour(new Date(now.getFullYear(),now.getMonth(),1)))),S.metric==='all'?'캐시 포함':'캐시 제외')}

/* 사용량 탭 */
function chart(){const box=$('#chart'),K=seriesKeys(),R=rows();box.replaceChildren();
  const totals=Object.fromEntries(K.map(([k])=>[k,0]));R.forEach(r=>K.forEach(([k])=>totals[k]+=r.v[k]||0));const all=Object.values(totals).reduce((a,b)=>a+b,0);
  $('#ranktitle').textContent=`이 기간 합계 ${ko(all)}`;const rk=$('#rank');rk.replaceChildren();
  K.slice().sort((a,b)=>totals[b[0]]-totals[a[0]]).forEach(([k,n])=>{const tr=h('tr'),td=h('td'),i=h('i');i.style.background=colorOf(k);td.append(i,document.createTextNode(n));
    tr.append(td,h('td','num',ko(totals[k])),h('td','num muted',all?(100*totals[k]/all).toFixed(0)+'%':'-'));rk.appendChild(tr)});
  $('#viewnote').textContent=(S.view==='block'?'5시간 블록은 첫 사용 시각(정시)부터 5시간씩 나눈 추정임. ':'')+(S.metric==='all'?'전체 = 새 입력 + 캐시 재사용 + 출력(캐시 재사용은 요금이 약 10%라 실제 부담보다 크게 보임)':'캐시 제외 = 새 입력 + 출력(실제 부담에 더 가까움)');
  if(!all){box.appendChild(h('div','empty','이 기간에는 기록 없음'));table(R,K);return}
  const W=Math.max(300,box.clientWidth),H=230,L=46,T=8,Bt=24,max=Math.max(...R.map(r=>Object.values(r.v).reduce((a,b)=>a+b,0)))*1.08;
  const s=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'기간별 토큰 사용량'},box);axes(s,W,H,L,T,Bt,max);
  const slot=(W-L)/R.length,bw=Math.max(2,Math.min(28,slot*.7)),step=Math.ceil(R.length/Math.max(4,Math.floor((W-L)/78)));
  R.forEach((r,i)=>{const g=el('g',{class:'col',tabindex:0},s),x0=L+i*slot;el('rect',{x:x0,y:T,width:slot,height:H-T-Bt,fill:'transparent',class:'hl',rx:4},g);
    let y=H-Bt;const segs=K.filter(([k])=>r.v[k]>0);segs.forEach(([k],j)=>{const hh=(H-T-Bt)*r.v[k]/max;y-=hh;const gap=j<segs.length-1?1:0,top=j===segs.length-1,x=x0+(slot-bw)/2,y1=y+gap,hv=Math.max(0,hh-gap),rad=top?Math.min(3,hv):0;
      el('path',{d:`M${x},${y1+hv} V${y1+rad} Q${x},${y1} ${x+rad},${y1} H${x+bw-rad} Q${x+bw},${y1} ${x+bw},${y1+rad} V${y1+hv} Z`,fill:colorOf(k)},g)});
    hover(g,label(r.k),K.map(([k,n])=>[n,r.v[k]||0,colorOf(k)]).filter(x=>x[1]>0));
    if(i%step===0||i===R.length-1&&R.length<16){const t=el('text',{x:x0+slot/2,y:H-7,class:'axis','text-anchor':'middle'},s);t.textContent=label(r.k,S.view==='hour'&&!r.k.endsWith('T00')||S.view==='block')}});
  table(R,K)}
function table(R,K){const t=h('table'),hd=h('tr');hd.appendChild(h('th',null,'기간'));K.forEach(([,n])=>hd.appendChild(h('th','num',n)));hd.appendChild(h('th','num','합계'));t.appendChild(hd);
  R.slice().reverse().forEach(r=>{const tot=Object.values(r.v).reduce((a,b)=>a+b,0);if(!tot)return;const tr=h('tr');tr.appendChild(h('td',null,label(r.k)));
    K.forEach(([k])=>tr.appendChild(h('td','num',ko(r.v[k]||0))));tr.appendChild(h('td','num',ko(tot)));t.appendChild(tr)});$('#tbl').replaceChildren(t)}

/* 요청 탭 */
function reqTags(r){const t=[];if(r.turns>=30)t.push(`${r.turns}턴`);if(Object.keys(r.subs).length)t.push('서브에이전트');
  if(r.rewrites)t.push('캐시 재작성');if(r.compact)t.push('컴팩션');if(r.big)t.push('큰 결과');if(r.auto)t.push('자동 알림');return t}
function reqDetail(r){const ul=h('ul'),m=S.metric==='all';
  li(ul,B('메인 대화 '),`${ko(m?r.in+r.cache+r.out:r.in+r.out)} · ${r.turns}턴`);
  const tools=Object.entries(r.tools).sort((a,b)=>b[1]-a[1]);if(tools.length)li(ul,B('쓴 도구 '),tools.map(([k,v])=>`${k} ${v}회`).join(', '));
  Object.entries(r.subs).forEach(([k,s])=>li(ul,B('서브에이전트 '),`${k} ${ko(m?s.in+s.cache+s.out:s.in+s.out)} · ${s.turns}턴`));
  const mo=Object.entries(r.models).sort((a,b)=>b[1]-a[1]);if(mo.length)li(ul,B('모델 '),mo.map(([k,v])=>`${FAMN[k]||k} ${ko(v)}`).join(', '));
  if(r.rewrites)li(ul,B('캐시 재작성 '),`${r.rewrites}회 · ${ko(r.rewrite_tokens)}`+(r.idle_rewrites?` · 5분 넘게 쉰 뒤 ${r.idle_rewrites}회`:''));
  if(r.compact)li(ul,B('컴팩션 '),`${r.compact}회`);if(r.big)li(ul,B('가장 큰 도구 결과 '),`${r.big.toLocaleString()}자`);
  return ul}
function reqTable(list,box,limit){box.replaceChildren();if(!list.length){box.appendChild(h('div','empty','해당 요청 없음'));return}
  const t=h('table'),hd=h('tr');['시각','저장소','요청','토큰','단서'].forEach((x,i)=>hd.appendChild(h('th',i===3?'num':null,x)));t.appendChild(hd);
  list.slice(0,limit).forEach(r=>{const tr=h('tr','req');tr.tabIndex=0;const q=h('td','q',r.text||'(내용 없음)');if(r.auto)q.classList.add('muted');
    const tg=h('td');reqTags(r).forEach(x=>tg.appendChild(h('span','tag',x)));
    tr.append(h('td',null,r.ts.slice(5,16).replace('-','/').replace('T',' ')),h('td',null,projName(r.proj)),q,h('td','num',ko(reqVal(r))),tg);
    const det=h('tr','det');det.hidden=true;const dc=h('td');dc.colSpan=5;dc.appendChild(reqDetail(r));det.appendChild(dc);
    const tog=()=>{det.hidden=!det.hidden};tr.addEventListener('click',tog);tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog()}});t.append(tr,det)});
  box.appendChild(t)}
function requests(){const from=new Date(Date.now()-(+S.range)*864e5);reqTable(D.requests.filter(r=>new Date(r.ts)>=from).sort((a,b)=>reqVal(b)-reqVal(a)),$('#reqs'),30)}

/* 원인 탭: 원인마다 한 줄 요약, 펼치면 설명·줄이는 법·해당 요청 */
function causeList(){const g=D.signals;return[
  {id:'sub',name:'서브에이전트',tokens:g.sub_tokens,val:ko(g.sub_tokens),pred:r=>Object.keys(r.subs).length>0,
   why:['조사·검토를 맡긴 서브에이전트가 쓴 양','메인 대화와 따로 세지만 같은 한도를 씀'],fix:['에이전트 파일에 Haiku·Sonnet 지정','결과는 요약만 받게 지시']},
  {id:'long',name:'30턴 넘는 긴 요청',tokens:g.long_tokens,val:`${g.long}개 · ${ko(g.long_tokens)}`,pred:r=>r.turns>=30,
   why:['한 요청에서 도구를 여러 번 돌리며 대화가 계속 커짐','턴마다 앞 내용을 다시 보냄'],fix:['요청을 작게 나누기','긴 조사는 서브에이전트로 넘기기']},
  {id:'rewrite',name:'캐시 재작성',tokens:g.rewrite_tokens,val:`${g.rewrites}회 · ${ko(g.rewrite_tokens)}`,pred:r=>r.rewrites>0,
   why:['캐시 수명은 5분',`5분 넘게 쉰 뒤 이어간 경우 ${g.idle_rewrites}회`,'그 밖에는 도구·설정 변경 등으로 캐시가 깨진 경우'],fix:['오래 쉰 뒤 다른 일이면 /clear나 새 세션','작업 중 MCP·설정 변경 줄이기']},
  {id:'auto',name:'자동 알림에 대한 응답',tokens:g.auto_tokens,val:`${g.auto}개 · ${ko(g.auto_tokens)}`,pred:r=>r.auto,
   why:['백그라운드 작업이 끝났다는 알림에도 응답이 오감'],fix:['백그라운드 작업을 여러 개 동시에 돌리지 않기']},
  {id:'big',name:'2만 자 넘는 도구 결과',tokens:null,val:`${g.big}개 요청`,pred:r=>r.big>0,tools:true,
   why:['큰 파일·긴 로그를 통째로 읽음','읽은 내용이 이후 턴마다 다시 실림'],fix:['검색·줄 범위로 필요한 부분만 읽기','긴 출력은 요약·필터 후 보기']},
  {id:'compact',name:'대화 요약(컴팩션)',tokens:null,val:`${g.compacts}회`,pred:r=>r.compact>0,
   why:['대화가 한도까지 길어져 자동으로 요약됨'],fix:['작업이 바뀔 때 /clear로 끊기']},
  {id:'start',name:'세션 시작 크기',tokens:null,val:(()=>{const st=D.starts;return st.length?`최근 ${ko(st[st.length-1].ctx)} · 중앙값 ${ko(med(st.map(s=>s.ctx)))}`:'-'})(),starts:true,
   why:['아무 일도 하기 전 기본으로 싣는 양','스킬·플러그인·MCP·CLAUDE.md가 늘면 커짐'],fix:['/context로 무엇이 차지하는지 확인','안 쓰는 MCP 서버 끄기']}]}
function causes(){const box=$('#causes');box.replaceChildren();const g=D.signals,open=new Set((S.open||'').split('.').filter(Boolean));
  $('#causenote').textContent=`최근 30일 요청 ${g.requests.toLocaleString()}개 · 캐시 제외 ${ko(g.total)} 기준 · 원인은 서로 겹칠 수 있음`;
  causeList().forEach(c=>{const d=h('details');if(open.has(c.id))d.open=true;const s=h('summary');
    const meter=h('span','meter'),bar=h('span');bar.style.width=c.tokens!=null&&g.total?Math.min(100,100*c.tokens/g.total)+'%':'0';meter.appendChild(bar);
    s.append(h('span','name',c.name),h('span','val',c.val),meter,h('span','pct',c.tokens!=null&&g.total?Math.round(100*c.tokens/g.total)+'%':''));d.appendChild(s);
    const b=h('div','acc-body');const w=h('ul');c.why.forEach(x=>li(w,x));const f=h('ul');c.fix.forEach(x=>li(f,x));
    b.append(h('div',null,'왜 생기나'),w,h('div',null,'줄이는 법'),f);
    if(c.starts)b.appendChild(startsChart());
    if(c.tools&&D.tools.length){const t=h('table'),hd=h('tr');['시각','저장소','누가','도구','글자 수'].forEach((x,i)=>hd.appendChild(h('th',i===4?'num':null,x)));t.appendChild(hd);
      D.tools.slice(0,8).forEach(r=>{const tr=h('tr');tr.append(h('td',null,r.ts.slice(5,16).replace('-','/').replace('T',' ')),h('td',null,projName(r.proj)),h('td',null,r.who==='main'?'메인':r.who.slice(4)),h('td',null,r.tool),h('td','num',r.chars.toLocaleString()));t.appendChild(tr)});
      b.append(h('div',null,'최근 7일 큰 결과'),t)}
    const rl=D.requests.filter(c.pred).sort((a,b)=>reqVal(b)-reqVal(a));if(rl.length){b.appendChild(h('div',null,'해당 요청(많이 쓴 순)'));const rb=h('div');reqTable(rl,rb,5);b.appendChild(rb)}
    d.appendChild(b);d.addEventListener('toggle',()=>{d.open?open.add(c.id):open.delete(c.id);S.open=[...open].join('.');save()});box.appendChild(d)})}
function startsChart(){const box=h('div');const P=D.starts;if(!P.length)return box;setTimeout(()=>{
  const W=Math.max(300,box.clientWidth||600),H=150,L=46,T=8,Bt=18,max=Math.max(...P.map(p=>p.ctx))*1.12,s=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'세션 시작 크기 추이'},box);
  axes(s,W,H,L,T,Bt,max);const xs=P.map((p,i)=>L+10+(W-L-20)*(P.length>1?i/(P.length-1):.5)),ys=P.map(p=>T+(H-T-Bt)*(1-p.ctx/max)),m=med(P.map(p=>p.ctx)),my=T+(H-T-Bt)*(1-m/max);
  el('line',{x1:L,x2:W,y1:my,y2:my,class:'medline'},s);el('path',{d:xs.map((x,i)=>(i?'L':'M')+x+','+ys[i]).join(' '),class:'sline'},s);
  P.forEach((p,i)=>{const g=el('g',{class:'col',tabindex:0},s);el('circle',{cx:xs[i],cy:ys[i],r:12,fill:'transparent'},g);el('circle',{cx:xs[i],cy:ys[i],r:i===P.length-1?5:3,fill:'var(--c0)',stroke:'var(--card)','stroke-width':2},g);
    hover(g,`${p.ts.slice(5,16).replace('-','/').replace('T',' ')} · ${projName(p.proj)}`,[['시작 크기',p.ctx,'var(--c0)']])})},0);return box}

function meta(){const u=new Date(D.updated),ks=Object.keys(D.hourly).sort(),ago=Math.max(0,Math.round((Date.now()-u)/60000));
  $('#meta').textContent=`이 기기 · ${ks.length?ks[0].slice(0,10):'-'}부터 · ${ago?ago+'분 전':'방금'} 갱신`;
  $('#offnote').replaceChildren();if(!D.enabled)$('#offnote').appendChild(h('div','off','기록 꺼짐 → 새 사용분 반영 안 됨. Claude에게 "토큰 기록 켜줘"라고 하면 됨'))}
function save(){history.replaceState(null,'','#'+Object.entries(S).filter(([,v])=>v!=='').map(([k,v])=>`${k}=${v}`).join('&'))}
function all(){$$('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',S[g.dataset.k]===b.dataset.v)));
  $$('.tabs button').forEach(b=>b.setAttribute('aria-selected',S.tab===b.dataset.t));$$('[data-p]').forEach(p=>p.hidden=p.dataset.p!==S.tab);
  save();meta();glance();if(S.tab==='usage')chart();if(S.tab==='reqs')requests();if(S.tab==='causes')causes()}
$$('.seg').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S[g.dataset.k]=b.dataset.v;all()}));
$$('.tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.t;all()}));
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(all,150)});
const auto=$('#auto');let on=true;try{on=localStorage.getItem('usage-auto')!=='0'}catch(e){}auto.checked=on;
auto.onchange=()=>{try{localStorage.setItem('usage-auto',auto.checked?'1':'0')}catch(e){}};
try{const y=sessionStorage.getItem('usage-scroll');if(y)scrollTo(0,+y)}catch(e){}
setInterval(()=>{const busy=tip.style.display==='block'||document.querySelector('.det:not([hidden])');if(auto.checked&&!document.hidden&&!busy){try{sessionStorage.setItem('usage-scroll',scrollY)}catch(e){}location.reload()}},30000);
all();
</script></body></html>
