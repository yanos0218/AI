<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}

.ins.warn .ic{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.ins .t{font-size:12px;color:var(--ink3)}.ins .b{font-weight:600;line-height:1.4}.ins .b small{font-weight:400;color:var(--ink2);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}

.req{cursor:pointer}.req:hover td{background:var(--hover)}.req td.q{max-width:480px}.req .p{font-weight:600;color:var(--ink2);white-space:nowrap}

.prompt{white-space:pre-wrap;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;max-height:160px;overflow:auto;margin-bottom:10px}
.steps{list-style:none;margin:0;padding:0 0 0 8px;max-height:320px;overflow:auto}
.steps li{position:relative;border-left:2px solid var(--line);padding:3px 0 3px 16px;font-size:12.5px;display:flex;gap:8px;align-items:baseline}
.steps li::before{content:'';position:absolute;left:-5px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.steps li.tool::before{background:var(--accent)}.steps li.res::before{background:var(--c2)}.steps li.res.err::before{background:var(--bad)}.steps li.say::before{background:var(--c3)}
.steps .k{flex:none;font-size:11px;font-weight:600;color:var(--ink2);min-width:70px}.steps code{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--ink);word-break:break-all}
.steps .x{color:var(--ink2);word-break:break-all}.steps .sz{flex:none;color:var(--ink3);font-size:11px;margin-left:auto;padding-left:8px}
details.acc{border-top:1px solid var(--line)}details.acc:first-of-type{border-top:0}
details.acc summary{cursor:pointer;list-style:none;padding:12px 4px;display:grid;grid-template-columns:14px minmax(0,1fr) auto 120px 40px 118px;gap:12px;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .chev{color:var(--ink3);transition:transform .15s;font-size:16px}details.acc[open] summary .chev{transform:rotate(90deg)}
details.acc summary .name{font-weight:600;display:flex;align-items:center;gap:4px}details.acc summary .val{font-weight:600;text-align:right}
.meter{height:6px;border-radius:3px;background:var(--hover);overflow:hidden}.meter span{display:block;height:100%;background:var(--c1);border-radius:3px}
.pct{color:var(--ink3);font-size:12px;text-align:right}.trend{font-size:11.5px;text-align:right;white-space:nowrap}
.up{color:var(--bad)}.down{color:var(--good)}.muted{color:var(--ink3)}
.acc-body{padding:0 4px 16px 30px;font-size:13px;color:var(--ink2);display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}@media (max-width:760px){.acc-body{grid-template-columns:1fr}}
.acc-body h4{margin:4px 0;font-size:12px;color:var(--ink3);font-weight:600}.acc-body ul{margin:0 0 6px;padding-left:18px}.acc-body .full{grid-column:1/-1}
.help{font:inherit;font-size:10.5px;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);background:var(--s2);color:var(--ink3);cursor:help;padding:0;line-height:15px}
.empty{color:var(--ink3);padding:28px 0;text-align:center}
.off{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:13px}
.scroll{max-height:620px;overflow:auto}
footer{max-width:1180px;margin:0 auto;padding:0 20px 28px;color:var(--ink3);font-size:12px;display:flex;gap:18px;flex-wrap:wrap}
[hidden]{display:none!important}

<script>
const D=__DATA__, DET=window.DETAILS||{};
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s), NS='http://www.w3.org/2000/svg';
const FAM=['opus','sonnet','haiku','fable','other'], FAMN={opus:'Opus',sonnet:'Sonnet',haiku:'Haiku',fable:'Fable',other:'기타'};
const pad=n=>String(n).padStart(2,'0');
const kHour=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}`;
const hourDate=k=>new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10),+k.slice(11,13));
function ko(n){n=Math.round(n);if(n>=1e8)return(n/1e8).toFixed(n>=1e9?0:1)+'억';if(n>=1e4)return(n/1e4).toFixed(n>=1e5?0:1)+'만';return n.toLocaleString()}
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function h(t,cls,txt){const e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function li(parent,...parts){const l=h('li');parts.forEach(p=>l.append(typeof p==='string'?document.createTextNode(p):p));parent.appendChild(l);return l}
const B=t=>h('b',null,t);
const ICON={trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',cause:'<circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/>',req:'<path d="M4 6h16M4 12h10M4 18h7"/>',warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17v.5"/>'};
const svgIcon=n=>{const s=document.createElementNS(NS,'svg');s.setAttribute('width','16');s.setAttribute('height','16');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','2');s.innerHTML=ICON[n];return s};
let S={tab:'usage',view:'day',metric:'nocache',split:'proj',range:'7',open:'',proj:''};
try{const q=Object.fromEntries((location.hash.slice(1)||'').split('&').filter(x=>x.includes('=')).map(x=>x.split('=').map(decodeURIComponent)));Object.assign(S,q)}catch(e){}
const val=b=>S.metric==='all'?b.in+b.cache+b.out:b.in+b.out;
const reqVal=r=>S.metric==='all'?r.all:r.nocache;
function* cells(from,to){for(const hk in D.hourly){if(from&&hk<from)continue;if(to&&hk>=to)continue;const P=D.hourly[hk];
  for(const proj in P)for(const kind in P[proj])for(const f in P[proj][kind])yield [hk,proj,kind,f,P[proj][kind][f]]}}
const sum=(from,to)=>{let s=0;for(const c of cells(from,to))s+=val(c[4]);return s};
const projName=p=>p==='?'?'(알 수 없음)':p;
function groupOf(proj,kind,f){return S.split==='proj'?proj:S.split==='who'?(kind==='main'?'main':'sub'):f}
let TOPP=[];
function seriesKeys(){if(S.split==='who')return[['main','메인 대화'],['sub','서브에이전트']];
  if(S.split==='model'){const u=new Set();for(const c of cells())u.add(c[3]);return FAM.filter(f=>u.has(f)).map(f=>[f,FAMN[f]])}
  const t={};for(const [,p,,,b] of cells())t[p]=(t[p]||0)+val(b);
  TOPP=Object.entries(t).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0]);
  const ks=TOPP.map(p=>[p,projName(p)]);if(Object.keys(t).length>5)ks.push(['__etc','기타']);return ks}
const normKey=g=>S.split==='proj'&&!TOPP.includes(g)?'__etc':g;
function colorOf(key){if(S.split==='who')return key==='main'?'var(--c0)':'var(--c1)';
  if(S.split==='model')return `var(--c${FAM.indexOf(key)})`;const i=TOPP.indexOf(key);return i<0?'var(--c5)':`var(--c${i})`}
function blocks(){const act=[...new Set([...cells()].filter(c=>val(c[4])>0).map(c=>c[0]))].sort(),out=[];
  for(const hk of act){const d=hourDate(hk),last=out[out.length-1];if(!last||d>=last.end)out.push({start:d,end:new Date(+d+5*36e5),k:hk})}return out}
function periodKeys(){const now=new Date(),out=[];
  if(S.view==='hour'){for(let i=47;i>=0;i--)out.push(kHour(new Date(now-i*36e5)))}
  else if(S.view==='day'){for(let i=59;i>=0;i--){const k=kHour(new Date(now-i*864e5)).slice(0,10);if(k>=FIRST.slice(0,10)||i<14)out.push(k)}}
  else if(S.view==='month'){const ks=Object.keys(D.hourly).sort();const st=ks.length?hourDate(ks[0]):now;
    for(let d=new Date(st.getFullYear(),st.getMonth(),1);d<=now;d=new Date(d.getFullYear(),d.getMonth()+1,1))out.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}`)}
  else blocks().slice(-14).forEach(b=>out.push('B'+b.k));return out}
function bucketKey(hk,bl){if(S.view==='hour')return hk;if(S.view==='day')return hk.slice(0,10);if(S.view==='month')return hk.slice(0,7);
  const d=hourDate(hk);for(let i=bl.length-1;i>=0;i--)if(d>=bl[i].start&&d<bl[i].end)return 'B'+bl[i].k;return null}
function rows(){const keys=periodKeys(),m=Object.fromEntries(keys.map(k=>[k,{}])),bl=S.view==='block'?blocks():null;

   why:['캐시 수명은 5분',`5분 넘게 쉰 뒤 이어간 경우 ${g.idle_rewrites}회`,'그 밖에는 도구·설정 변경 등으로 캐시가 깨진 경우'],fix:['오래 쉰 뒤 다른 일이면 /clear나 새 세션','작업 중 MCP·설정 변경 줄이기']},
  {id:'auto',key:'auto_tokens',name:'자동 알림에 대한 응답',tokens:g.auto_tokens,val:`${g.auto}개 · ${ko(g.auto_tokens)}`,pred:r=>r.auto,
   why:['백그라운드 작업이 끝났다는 알림에도 응답이 오감'],fix:['백그라운드 작업을 여러 개 동시에 돌리지 않기']},
  {id:'big',key:'big',name:'2만 자 넘는 도구 결과',tokens:null,val:`${g.big}개 요청`,pred:r=>r.big>0,tools:true,
   why:['큰 파일·긴 로그를 통째로 읽음','읽은 내용이 이후 턴마다 다시 실림'],fix:['검색·줄 범위로 필요한 부분만 읽기','긴 출력은 요약·필터 후 보기']},
  {id:'compact',key:'compacts',name:'대화 요약(컴팩션)',tokens:null,val:`${g.compacts}회`,pred:r=>r.compact>0,
   why:['대화가 한도까지 길어져 자동으로 요약됨'],fix:['작업이 바뀔 때 /clear로 끊기']},
  {id:'start',name:'세션 시작 크기',tokens:null,val:(()=>{const st=D.starts;return st.length?`최근 ${ko(st[st.length-1].ctx)}`:'-'})(),starts:true,
   why:['아무 일도 하기 전 기본으로 싣는 양','스킬·플러그인·MCP·CLAUDE.md가 늘면 커짐'],fix:['/context로 무엇이 차지하는지 확인','안 쓰는 MCP 서버 끄기']}]}
function causes(){const box=$('#causes');box.replaceChildren();const g=D.signals,open=new Set((S.open||'').split('.').filter(Boolean));
  $('#causenote').textContent=`최근 30일 요청 ${g.requests.toLocaleString()}개 · 실사용 ${ko(g.total)} 기준 · 원인은 겹칠 수 있음`;
  causeList().forEach(c=>{const d=h('details','acc');if(open.has(c.id))d.open=true;const s=h('summary');
    const chev=h('span','chev','›'),nm=h('span','name',c.name);if(c.id==='rewrite')nm.appendChild(helpBtn('rewrite'));
    const meter=h('div','meter'),bar=h('span');bar.style.width=c.tokens!=null&&g.total?Math.min(100,100*c.tokens/g.total)+'%':'0';meter.appendChild(bar);
    const now7=(D.signals7||{})[c.key],prev7=(D.signals_prev7||{})[c.key],tr=h('span','trend');
    if(c.key&&prev7){const p=Math.round((now7/prev7-1)*100);tr.textContent=`지난주 대비 ${p>=0?'▲':'▼'}${Math.abs(p)}%`;tr.classList.add(p>10?'up':p<-10?'down':'muted')}else{tr.textContent=c.key?'비교 없음':'';tr.classList.add('muted')}
    s.append(chev,nm,h('span','val',c.val),meter,h('span','pct',c.tokens!=null&&g.total?Math.round(100*c.tokens/g.total)+'%':''),tr);d.appendChild(s);
    const b=h('div','acc-body'),w=h('ul'),f=h('ul');c.why.forEach(x=>li(w,x));c.fix.forEach(x=>li(f,x));
    const c1=h('div'),c2=h('div');c1.append(h('h4',null,'왜 생기나'),w);c2.append(h('h4',null,'줄이는 법'),f);b.append(c1,c2);
    if(c.starts){const fb=h('div','full');fb.appendChild(startsChart());b.appendChild(fb)}
    if(c.tools&&D.tools.length){const fb=h('div','full'),t=h('table'),hd=h('tr');['시각','저장소','누가','도구','글자 수'].forEach((x,i)=>hd.appendChild(h('th',i===4?'num':null,x)));t.appendChild(hd);
      D.tools.slice(0,8).forEach(r=>{const tr2=h('tr');tr2.append(h('td',null,r.ts.slice(5,16).replace('-','/').replace('T',' ')),h('td',null,projName(r.proj)),h('td',null,r.who==='main'?'메인':r.who.slice(4)),h('td',null,r.tool),h('td','num',r.chars.toLocaleString()));t.appendChild(tr2)});
      fb.append(h('h4',null,'최근 7일 큰 결과'),t);b.appendChild(fb)}
    if(c.pred){const rl=D.requests.filter(c.pred).sort((a,b)=>reqVal(b)-reqVal(a));if(rl.length){const fb=h('div','full'),rb=h('div');reqTable(rl,rb,5);fb.append(h('h4',null,'해당 요청(많이 쓴 순)'),rb);b.appendChild(fb)}}
    d.appendChild(b);d.addEventListener('toggle',()=>{d.open?open.add(c.id):open.delete(c.id);S.open=[...open].join('.');save()});box.appendChild(d)})}
function startsChart(){const box=h('div');const P=D.starts;if(!P.length)return box;setTimeout(()=>{
  const W=Math.max(300,box.clientWidth||600),H=150,L=46,T=8,Bt=18,max=Math.max(...P.map(p=>p.ctx))*1.12,s=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'세션 시작 크기 추이'},box);
  axes(s,W,H,L,T,Bt,max);const xs=P.map((p,i)=>L+10+(W-L-20)*(P.length>1?i/(P.length-1):.5)),ys=P.map(p=>T+(H-T-Bt)*(1-p.ctx/max)),m=med(P.map(p=>p.ctx)),my=T+(H-T-Bt)*(1-m/max);
  el('line',{x1:L,x2:W,y1:my,y2:my,class:'medline'},s);el('path',{d:xs.map((x,i)=>(i?'L':'M')+x+','+ys[i]).join(' '),class:'sline'},s);
  P.forEach((p,i)=>{const g=el('g',{class:'col',tabindex:0},s);el('circle',{cx:xs[i],cy:ys[i],r:12,fill:'transparent'},g);el('circle',{cx:xs[i],cy:ys[i],r:i===P.length-1?5:3,fill:'var(--accent)',stroke:'var(--s1)','stroke-width':2},g);
    hover(g,`${p.ts.slice(5,16).replace('-','/').replace('T',' ')} · ${projName(p.proj)}`,[['시작 크기',p.ctx,'var(--accent)']])})},0);return box}

/* 틀 */
function meta(){const u=new Date(D.updated),ks=Object.keys(D.hourly).sort(),ago=Math.max(0,Math.round((Date.now()-u)/60000));
  $('#meta').textContent=`${ks.length?ks[0].slice(0,10):'-'}부터 · ${ago?ago+'분 전':'방금'} 갱신`;
  $('#offnote').replaceChildren();if(!D.enabled)$('#offnote').appendChild(h('div','off','기록 꺼짐 → 새 사용분 반영 안 됨. Claude에게 "토큰 기록 켜줘"라고 하면 됨'))}
function save(){history.replaceState(null,'','#'+Object.entries(S).filter(([,v])=>v!=='').map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&'))}
function all(){$$('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',S[g.dataset.k]===b.dataset.v)));
  $$('.tabs button').forEach(b=>b.setAttribute('aria-selected',S.tab===b.dataset.t));$$('[data-p]').forEach(p=>p.hidden=p.dataset.p!==S.tab);
  save();meta();if(S.tab==='usage'){insights();kpis();chart()}if(S.tab==='reqs')requests();if(S.tab==='causes')causes()}
$$('.seg').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S[g.dataset.k]=b.dataset.v;all()}));
$$('.tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.t;all()}));
$('#q').addEventListener('input',()=>requests());$('#pf').addEventListener('change',e=>{S.proj=e.target.value;save();requests()});
$('#mhelp').appendChild(helpBtn('metric'));
const TH=['auto','dark','light'],THN={auto:'◐ 시스템',dark:'● 어둡게',light:'○ 밝게'};let th='auto';try{th=localStorage.getItem('usage-theme')||'auto'}catch(e){}
const thb=$('#theme');const applyTh=()=>{thb.textContent=THN[th];if(th==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=th};applyTh();
thb.onclick=()=>{th=TH[(TH.indexOf(th)+1)%3];try{localStorage.setItem('usage-theme',th)}catch(e){}applyTh();all()};
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(all,150)});
const auto=$('#auto');let on=true;try{on=localStorage.getItem('usage-auto')!=='0'}catch(e){}auto.setAttribute('aria-pressed',on);
auto.onclick=()=>{on=!on;auto.setAttribute('aria-pressed',on);try{localStorage.setItem('usage-auto',on?'1':'0')}catch(e){}};
try{const y=sessionStorage.getItem('usage-scroll');if(y)scrollTo(0,+y)}catch(e){}
setInterval(()=>{const busy=tip.style.display==='block'||document.querySelector('.det:not([hidden])')||document.activeElement===$('#q')||$('#q').value;
  if(on&&!document.hidden&&!busy){try{sessionStorage.setItem('usage-scroll',scrollY)}catch(e){}location.reload()}},30000);
all();
</script></body></html>
